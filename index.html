<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Hospital - Patient Management System</title>
  <!-- Chart.js CDN for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; }
    .app-container { display: flex; min-height: 100vh; }
    
    /* Sidebar Navigation */
    .sidebar { width: 240px; background-color: #1a2530; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar-top { flex: 1; }
    .sidebar-brand { padding: 20px; font-size: 1.2rem; font-weight: bold; background-color: #111822; display: flex; align-items: center; gap: 10px; }
    .sidebar-menu { list-style: none; margin-top: 20px; }
    .sidebar-menu li { padding: 12px 20px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; color: #b8c7ce; }
    .sidebar-menu li:hover, .sidebar-menu li.active { background-color: #253545; color: #ffffff; border-left: 4px solid #0084ff; }
    .logout-btn { padding: 15px 20px; border-top: 1px solid #253545; cursor: pointer; color: #ff6b6b; display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .logout-btn:hover { background-color: #253545; }

    .main-content { flex: 1; display: flex; flex-direction: column; background-color: #f4f7f6; }
    
    /* Top Navbar with Admin Dropdown */
    .top-navbar { background-color: #ffffff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .top-navbar h2 { font-size: 1.3rem; color: #222; }
    .admin-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: #444; background: #f8f9fa; padding: 6px 14px; border-radius: 20px; border: 1px solid #e0e0e0; }
    .admin-avatar { width: 28px; height: 28px; background: #0084ff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; }

    .content-body { padding: 25px 30px; flex: 1; }
    
    /* Stats Cards Grid (4 Cards) */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: #ffffff; padding: 18px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; }
    .stat-card .icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .stat-card.blue .icon { background: #e3f2fd; color: #1976d2; }
    .stat-card.green .icon { background: #e8f5e9; color: #388e3c; }
    .stat-card.purple .icon { background: #f3e5f5; color: #7b1fa2; }
    .stat-card.orange .icon { background: #fff3e0; color: #e65100; }
    .stat-info h3 { font-size: 1.6rem; color: #222; margin-bottom: 2px; }
    .stat-info p { font-size: 0.8rem; color: #777; font-weight: 600; }
    
    /* Bed Occupancy Progress Card */
    .occupancy-card { background: white; padding: 18px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .progress-bar-container { background: #e9ecef; border-radius: 10px; height: 16px; overflow: hidden; margin-top: 10px; }
    .progress-bar { background: linear-gradient(90deg, #28a745, #ffc107); height: 100%; transition: width 0.4s ease; }
    
    /* Dashboard Split Layout */
    .dashboard-split { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
    .chart-card, .roster-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    /* Doctor Roster Widget Styles */
    .doctor-list { list-style: none; margin-top: 12px; }
    .doctor-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .doctor-item:last-child { border-bottom: none; }
    .doctor-info strong { display: block; font-size: 0.9rem; color: #222; }
    .doctor-info span { font-size: 0.78rem; color: #777; }
    .badge-status { padding: 4px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: bold; }
    .badge-onduty { background: #e8f5e9; color: #2e7d32; }
    .badge-surgery { background: #fff3cd; color: #856404; }
    .badge-offduty { background: #f8d7da; color: #721c24; }

    /* Search & Filter Header */
    .controls-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
    .search-filter-group { display: flex; gap: 10px; flex: 1; align-items: center; }
    .search-input, .select-input { padding: 9px 14px; border: 1px solid #d0d7de; border-radius: 6px; outline: none; font-size: 0.9rem; }
    .search-input { width: 280px; }
    
    .btn { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: #0084ff; color: white; }
    .btn-primary:hover { background: #0068cc; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-info { background: #17a2b8; color: white; }
    .btn-warning { background: #ffc107; color: #212529; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; margin-right: 4px; border-radius: 4px; }
    
    /* Table & Badges */
    .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
    th { background-color: #fafbfc; color: #555; font-weight: 600; border-bottom: 2px solid #e1e4e8; }
    tr:hover { background-color: #f8f9fa; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
    .badge-admitted { background: #e8f5e9; color: #2e7d32; }
    .badge-discharged { background: #e3f2fd; color: #1565c0; }
    .alert { padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    
    /* Pagination Controls */
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 18px; }
    .page-btn { padding: 5px 11px; border: 1px solid #d0d7de; background: white; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .page-btn.active { background: #0084ff; color: white; border-color: #0084ff; }
    .page-btn:hover:not(.active) { background: #f0f0f0; }

    /* Form Styles */
    .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 800px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #444; }
    .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 0.9rem; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; }
    
    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-icon-badge { width: 50px; height: 50px; background: #ffebee; color: #dc3545; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.4rem; }
    .modal-details { background: #f8f9fa; padding: 12px; border-radius: 6px; margin: 15px 0; text-align: left; font-size: 0.88rem; }
    .modal-details p { margin-bottom: 4px; color: #555; }
    .modal-details p strong { color: #222; }
    .modal-actions { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
    .detail-item { padding: 10px; background: #f8f9fa; border-radius: 6px; }
    .detail-item strong { display: block; font-size: 0.78rem; color: #666; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function App() {
      const TOTAL_BEDS = 50;
      const [activeTab, setActiveTab] = React.useState('dashboard');
      
      // Seed Data matching reference names and P00X ID structure
      const [patients, setPatients] = React.useState([
        { id: 'P001', name: 'Aarav Sharma', age: 25, gender: 'Male', phone: '9876543210', department: 'General Medicine', disease: 'Fever', doctor: 'Dr. Smith', admissionDate: '2026-04-20', status: 'Admitted' },
        { id: 'P002', name: 'Meera Iyer', age: 32, gender: 'Female', phone: '8765432109', department: 'Pediatrics', disease: 'Dengue', doctor: 'Dr. Adams', admissionDate: '2026-04-18', status: 'Admitted' },
        { id: 'P003', name: 'Rohan Das', age: 40, gender: 'Male', phone: '7654321098', department: 'Orthopedics', disease: 'Fracture', doctor: 'Dr. Smith', admissionDate: '2026-04-15', status: 'Discharged' },
        { id: 'P004', name: 'Sneha Patil', age: 28, gender: 'Female', phone: '6543210987', department: 'Neurology', disease: 'Migraine', doctor: 'Dr. Taylor', admissionDate: '2026-04-21', status: 'Admitted' },
        { id: 'P005', name: 'Vikram Singh', age: 55, gender: 'Male', phone: '5432109876', department: 'Cardiology', disease: 'Heart Disease', doctor: 'Dr. Wilson', admissionDate: '2026-04-10', status: 'Discharged' }
      ]);

      const [doctorsList] = React.useState([
        { id: 'D001', name: 'Dr. Smith', dept: 'Cardiology', shift: '08:00 - 16:00', status: 'On Duty', badgeClass: 'badge-onduty' },
        { id: 'D002', name: 'Dr. Adams', dept: 'General Medicine', shift: '09:00 - 17:00', status: 'In Surgery', badgeClass: 'badge-surgery' },
        { id: 'D003', name: 'Dr. Taylor', dept: 'Pediatrics', shift: '12:00 - 20:00', status: 'On Duty', badgeClass: 'badge-onduty' },
        { id: 'D004', name: 'Dr. Wilson', dept: 'Orthopedics', shift: 'Night Shift', status: 'Off Duty', badgeClass: 'badge-offduty' }
      ]);

      const [appointmentsList] = React.useState([
        { id: 'APT01', patient: 'Aarav Sharma', doctor: 'Dr. Smith', time: '10:30 AM', status: 'Confirmed' },
        { id: 'APT02', patient: 'Sneha Patil', doctor: 'Dr. Taylor', time: '02:00 PM', status: 'Pending' }
      ]);

      const [searchQuery, setSearchQuery] = React.useState('');
      const [filterDept, setFilterDept] = React.useState('All');
      const [filterStatus, setFilterStatus] = React.useState('All');
      const [selectedPatient, setSelectedPatient] = React.useState(null);
      const [deleteTarget, setDeleteTarget] = React.useState(null);
      const [alert, setAlert] = React.useState({ type: '', text: '' });
      const [formData, setFormData] = React.useState({
        name: '', age: '', gender: 'Male', phone: '',
        department: 'General Medicine', disease: '', doctor: 'Dr. Smith',
        admissionDate: '', status: 'Admitted'
      });

      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);

      const totalPatients = patients.length;
      const admittedCount = patients.filter(p => p.status === 'Admitted').length;
      const dischargedCount = patients.filter(p => p.status === 'Discharged').length;
      const totalDoctors = doctorsList.length;
      const occupancyPercent = Math.round((admittedCount / TOTAL_BEDS) * 100);

      React.useEffect(() => {
        if (activeTab === 'dashboard' && chartRef.current) {
          const deptCounts = patients.reduce((acc, p) => {
            acc[p.department] = (acc[p.department] || 0) + 1;
            return acc;
          }, {});

          if (chartInstance.current) chartInstance.current.destroy();

          chartInstance.current = new Chart(chartRef.current, {
            type: 'bar',
            data: {
              labels: Object.keys(deptCounts),
              datasets: [{
                label: 'Patients',
                data: Object.values(deptCounts),
                backgroundColor: '#0084ff',
                borderRadius: 4
              }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
          });
        }
      }, [activeTab, patients]);

      const showAlert = (type, text) => {
        setAlert({ type, text });
        setTimeout(() => setAlert({ type: '', text: '' }), 3500);
      };

      const handleInputChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const resetForm = () => {
        setFormData({
          name: '', age: '', gender: 'Male', phone: '',
          department: 'General Medicine', disease: '', doctor: 'Dr. Smith',
          admissionDate: '', status: 'Admitted'
        });
        setSelectedPatient(null);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (activeTab === 'edit') {
          setPatients(patients.map(p => p.id === selectedPatient.id ? { ...formData, id: selectedPatient.id } : p));
          showAlert('success', 'Patient record updated successfully!');
        } else {
          const nextNum = patients.length + 1;
          const newId = `P00${nextNum}`;
          const newPatient = { ...formData, id: newId };
          setPatients([...patients, newPatient]);
          showAlert('success', 'New patient added successfully!');
        }
        resetForm();
        setActiveTab('patients');
      };

      const handleDelete = () => {
        if (deleteTarget) {
          setPatients(patients.filter(p => p.id !== deleteTarget.id));
          showAlert('success', `Patient ${deleteTarget.id} deleted successfully!`);
          setDeleteTarget(null);
        }
      };

      const handleEdit = (p) => {
        setSelectedPatient(p);
        setFormData(p);
        setActiveTab('edit');
      };

      const exportToCSV = () => {
        const headers = "ID,Name,Age,Gender,Phone,Department,Disease,Doctor,Date,Status\n";
        const rows = patients.map(p => `${p.id},${p.name},${p.age},${p.gender},${p.phone},${p.department},${p.disease},${p.doctor},${p.admissionDate},${p.status}`);
        const blob = new Blob([headers + rows.join("\n")], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Hospital_Patients_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      };

      const filtered = patients.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.id.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesDept = filterDept === 'All' || p.department === filterDept;
        const matchesStat = filterStatus === 'All' || p.status === filterStatus;
        return matchesSearch && matchesDept && matchesStat;
      });

      return (
        <div className="app-container">
          {/* Sidebar Navigation */}
          <div className="sidebar">
            <div className="sidebar-top">
              <div className="sidebar-brand">🏥 MediCare Hospital</div>
              <ul className="sidebar-menu">
                <li className={activeTab === 'dashboard' ? 'active' : ''} onClick={() => setActiveTab('dashboard')}>📊 Dashboard</li>
                <li className={activeTab === 'patients' ? 'active' : ''} onClick={() => setActiveTab('patients')}>👥 Patients</li>
                <li className={activeTab === 'doctors' ? 'active' : ''} onClick={() => setActiveTab('doctors')}>👨‍⚕️ Doctors</li>
                <li className={activeTab === 'appointments' ? 'active' : ''} onClick={() => setActiveTab('appointments')}>📅 Appointments</li>
              </ul>
            </div>
            <div className="logout-btn" onClick={() => alert('Logged out successfully!')}>
              🚪 Logout
            </div>
          </div>

          <div className="main-content">
            {/* Top Navbar with Profile Dropdown */}
            <div className="top-navbar">
              <h2>MediCare Hospital Dashboard</h2>
              <div style={{display: 'flex', gap: '15px', alignItems: 'center'}}>
                <button className="btn btn-success btn-sm" onClick={exportToCSV}>📥 Export CSV</button>
                <div className="admin-profile">
                  <div className="admin-avatar">A</div>
                  <span>Admin ▾</span>
                </div>
              </div>
            </div>

            <div className="content-body">
              {alert.text && <div className={`alert alert-${alert.type}`}>{alert.text}</div>}

              {/* DASHBOARD VIEW */}
              {activeTab === 'dashboard' && (
                <div>
                  <p style={{color: '#666', marginBottom: '20px'}}>Welcome back, Admin! Here's an overview of the hospital.</p>

                  {/* 4 Stats Cards */}
                  <div className="stats-grid">
                    <div className="stat-card blue">
                      <div className="icon">👥</div>
                      <div className="stat-info"><h3>{totalPatients}</h3><p>Total Patients</p></div>
                    </div>
                    <div className="stat-card green">
                      <div className="icon">🏥</div>
                      <div className="stat-info"><h3>{admittedCount}</h3><p>Admitted Patients</p></div>
                    </div>
                    <div className="stat-card purple">
                      <div className="icon">✅</div>
                      <div className="stat-info"><h3>{dischargedCount}</h3><p>Discharged Patients</p></div>
                    </div>
                    <div className="stat-card orange">
                      <div className="icon">👨‍⚕️</div>
                      <div className="stat-info"><h3>{totalDoctors}</h3><p>Total Doctors</p></div>
                    </div>
                  </div>

                  {/* Live Bed Occupancy Progress Tracker */}
                  <div className="occupancy-card">
                    <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.9rem'}}>
                      <strong>Live Bed Occupancy Rate</strong>
                      <span>{admittedCount} / {TOTAL_BEDS} Beds Occupied ({occupancyPercent}%)</span>
                    </div>
                    <div className="progress-bar-container">
                      <div className="progress-bar" style={{width: `${occupancyPercent}%`}}></div>
                    </div>
                  </div>

                  <div className="dashboard-split">
                    <div className="chart-card">
                      <h3 style={{marginBottom: '15px', fontSize: '1.1rem'}}>Department Analytics</h3>
                      <canvas ref={chartRef} height="120"></canvas>
                    </div>

                    <div className="roster-card">
                      <h3 style={{fontSize: '1.1rem'}}>👨‍⚕️ On-Duty Doctors</h3>
                      <ul className="doctor-list">
                        {doctorsList.map((doc, idx) => (
                          <li className="doctor-item" key={idx}>
                            <div className="doctor-info">
                              <strong>{doc.name}</strong>
                              <span>{doc.dept} • {doc.shift}</span>
                            </div>
                            <span className={`badge-status ${doc.badgeClass}`}>{doc.status}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>

                  <h3 style={{marginBottom: '12px', fontSize: '1.1rem'}}>Recent Patients</h3>
                  <div className="table-container">
                    <table>
                      <thead>
                        <tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Disease</th><th>Status</th><th>Actions</th></tr>
                      </thead>
                      <tbody>
                        {patients.slice(0, 5).map(p => (
                          <tr key={p.id}>
                            <td><strong>{p.id}</strong></td>
                            <td>{p.name}</td>
                            <td>{p.age}</td>
                            <td>{p.gender}</td>
                            <td>{p.disease}</td>
                            <td><span className={`badge badge-${p.status.toLowerCase()}`}>{p.status}</span></td>
                            <td>
                              <button className="btn btn-info btn-sm" onClick={() => { setSelectedPatient(p); setActiveTab('view'); }}>View</button>
                              <button className="btn btn-warning btn-sm" onClick={() => handleEdit(p)}>Edit</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* PATIENTS VIEW */}
              {activeTab === 'patients' && (
                <div>
                  <h2 style={{marginBottom: '20px'}}>Patients</h2>
                  <div className="controls-header">
                    <div className="search-filter-group">
                      <input type="text" className="search-input" placeholder="Search by name or patient ID..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                      <button className="btn btn-primary">🔍 Search</button>
                      <select className="select-input" value={filterDept} onChange={e => setFilterDept(e.target.value)}>
                        <option value="All">All Departments</option>
                        <option value="General Medicine">General Medicine</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Neurology">Neurology</option>
                      </select>
                      <select className="select-input" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
                        <option value="All">All Statuses</option>
                        <option value="Admitted">Admitted</option>
                        <option value="Discharged">Discharged</option>
                      </select>
                    </div>
                    <button className="btn btn-primary" onClick={() => { resetForm(); setActiveTab('add'); }}>+ Add Patient</button>
                  </div>

                  <div className="table-container">
                    <table>
                      <thead>
                        <tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Department</th><th>Phone</th><th>Status</th><th>Actions</th></tr>
                      </thead>
                      <tbody>
                        {filtered.map(p => (
                          <tr key={p.id}>
                            <td><strong>{p.id}</strong></td>
                            <td>{p.name}</td>
                            <td>{p.age}</td>
                            <td>{p.gender}</td>
                            <td>{p.department}</td>
                            <td>{p.phone}</td>
                            <td><span className={`badge badge-${p.status.toLowerCase()}`}>{p.status}</span></td>
                            <td>
                              <button className="btn btn-info btn-sm" onClick={() => { setSelectedPatient(p); setActiveTab('view'); }}>View</button>
                              <button className="btn btn-warning btn-sm" onClick={() => handleEdit(p)}>Edit</button>
                              <button className="btn btn-danger btn-sm" onClick={() => setDeleteTarget(p)}>Delete</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Pagination Controls matching reference */}
                  <div className="pagination">
                    <button className="page-btn">&lt;</button>
                    <button className="page-btn active">1</button>
                    <button className="page-btn">2</button>
                    <button className="page-btn">3</button>
                    <button className="page-btn">&gt;</button>
                  </div>
                </div>
              )}

              {/* DOCTORS VIEW */}
              {activeTab === 'doctors' && (
                <div>
                  <h2 style={{marginBottom: '20px'}}>Doctors Directory</h2>
                  <div className="table-container">
                    <table>
                      <thead>
                        <tr><th>Doctor ID</th><th>Name</th><th>Department</th><th>Shift Time</th><th>Status</th></tr>
                      </thead>
                      <tbody>
                        {doctorsList.map(doc => (
                          <tr key={doc.id}>
                            <td><strong>{doc.id}</strong></td>
                            <td>{doc.name}</td>
                            <td>{doc.dept}</td>
                            <td>{doc.shift}</td>
                            <td><span className={`badge-status ${doc.badgeClass}`}>{doc.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* APPOINTMENTS VIEW */}
              {activeTab === 'appointments' && (
                <div>
                  <h2 style={{marginBottom: '20px'}}>Appointments Schedule</h2>
                  <div className="table-container">
                    <table>
                      <thead>
                        <tr><th>Appt ID</th><th>Patient Name</th><th>Assigned Doctor</th><th>Time</th><th>Status</th></tr>
                      </thead>
                      <tbody>
                        {appointmentsList.map(apt => (
                          <tr key={apt.id}>
                            <td><strong>{apt.id}</strong></td>
                            <td>{apt.patient}</td>
                            <td>{apt.doctor}</td>
                            <td>{apt.time}</td>
                            <td><span className="badge badge-admitted">{apt.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ADD / EDIT PATIENT FORM */}
              {(activeTab === 'add' || activeTab === 'edit') && (
                <div className="form-card">
                  <h3>{activeTab === 'add' ? 'Add Patient' : 'Edit Patient'}</h3>
                  <form onSubmit={handleSubmit} style={{marginTop: '20px'}}>
                    <div className="form-grid">
                      <div className="form-group"><label>Patient Name *</label><input type="text" name="name" required placeholder="Enter patient name" value={formData.name} onChange={handleInputChange} /></div>
                      <div className="form-group"><label>Age *</label><input type="number" name="age" required placeholder="Enter age" value={formData.age} onChange={handleInputChange} /></div>
                      <div className="form-group">
                        <label>Gender *</label>
                        <select name="gender" value={formData.gender} onChange={handleInputChange}>
                          <option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option>
                        </select>
                      </div>
                      <div className="form-group"><label>Phone Number *</label><input type="text" name="phone" required placeholder="Enter phone number" value={formData.phone} onChange={handleInputChange} /></div>
                      <div className="form-group">
                        <label>Department *</label>
                        <select name="department" value={formData.department} onChange={handleInputChange}>
                          <option value="General Medicine">General Medicine</option>
                          <option value="Pediatrics">Pediatrics</option>
                          <option value="Orthopedics">Orthopedics</option>
                          <option value="Cardiology">Cardiology</option>
                          <option value="Neurology">Neurology</option>
                        </select>
                      </div>
                      <div className="form-group"><label>Disease / Reason *</label><input type="text" name="disease" required placeholder="Enter disease or reason" value={formData.disease} onChange={handleInputChange} /></div>
                      <div className="form-group"><label>Doctor Assigned *</label><input type="text" name="doctor" required value={formData.doctor} onChange={handleInputChange} /></div>
                      <div className="form-group"><label>Admission Date *</label><input type="date" name="admissionDate" required value={formData.admissionDate} onChange={handleInputChange} /></div>
                      <div className="form-group">
                        <label>Status *</label>
                        <select name="status" value={formData.status} onChange={handleInputChange}>
                          <option value="Admitted">Admitted</option><option value="Discharged">Discharged</option>
                        </select>
                      </div>
                    </div>
                    <div className="form-actions">
                      <button type="button" className="btn btn-secondary" onClick={() => setActiveTab('patients')}>Cancel</button>
                      <button type="submit" className="btn btn-primary">{activeTab === 'add' ? 'Add Patient' : 'Update Patient'}</button>
                    </div>
                  </form>
                </div>
              )}

              {/* VIEW PATIENT DETAILS */}
              {activeTab === 'view' && selectedPatient && (
                <div className="form-card">
                  <h3>Patient Details ({selectedPatient.id})</h3>
                  <div className="detail-grid">
                    <div className="detail-item"><strong>Patient ID</strong>{selectedPatient.id}</div>
                    <div className="detail-item"><strong>Name</strong>{selectedPatient.name}</div>
                    <div className="detail-item"><strong>Age</strong>{selectedPatient.age}</div>
                    <div className="detail-item"><strong>Gender</strong>{selectedPatient.gender}</div>
                    <div className="detail-item"><strong>Phone Number</strong>{selectedPatient.phone}</div>
                    <div className="detail-item"><strong>Department</strong>{selectedPatient.department}</div>
                    <div className="detail-item"><strong>Disease / Reason</strong>{selectedPatient.disease}</div>
                    <div className="detail-item"><strong>Doctor Assigned</strong>{selectedPatient.doctor}</div>
                    <div className="detail-item"><strong>Admission Date</strong>{selectedPatient.admissionDate}</div>
                    <div className="detail-item"><strong>Status</strong>{selectedPatient.status}</div>
                  </div>
                  <div className="form-actions" style={{marginTop: '20px'}}>
                    <button className="btn btn-secondary" onClick={() => setActiveTab('patients')}>Back</button>
                  </div>
                </div>
              )}

              {/* DELETE MODAL MATCHING REFERENCE UI */}
              {deleteTarget && (
                <div className="modal-overlay">
                  <div className="modal">
                    <div className="modal-icon-badge">🗑️</div>
                    <h3 style={{fontSize: '1.2rem', color: '#222'}}>Delete Patient</h3>
                    <p style={{fontSize: '0.85rem', color: '#666', marginTop: '6px'}}>Are you sure you want to delete this patient?<br/>This action cannot be undone.</p>
                    
                    <div className="modal-details">
                      <p><strong>Patient ID:</strong> {deleteTarget.id}</p>
                      <p><strong>Name:</strong> {deleteTarget.name}</p>
                    </div>

                    <div className="modal-actions">
                      <button className="btn btn-secondary" onClick={() => setDeleteTarget(null)}>Cancel</button>
                      <button className="btn btn-danger" onClick={handleDelete}>Delete</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
